<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>凡構國際 報價系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #fdfbf7; color: #2c2c2c; }
        
        /* 導航列 */
        .nav { position: fixed; top: 0; left: 0; right: 0; background: #1a3d34; display: flex; justify-content: space-around; padding: 15px; z-index: 9999; }
        .nav a { color: white; text-decoration: none; padding: 10px 20px; opacity: 0.5; }
        .nav a.active { opacity: 1; background: #d4a853; border-radius: 8px; color: #1a3d34; }
        
        /* 內容區 */
        .content { padding: 70px 15px 20px; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* 表單 */
        .card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; color: #6b6b6b; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: #1a3d34; color: white; }
        .btn-accent { background: #d4a853; color: #1a3d34; margin-top: 10px; }
    </style>
</head>
<body>
    <!-- 導航 -->
    <nav class="nav">
        <a href="#" onclick="switchTab('new');return false;" id="nav-new" class="active">📝 報價</a>
        <a href="#" onclick="switchTab('list');return false;" id="nav-list">📋 列表</a>
        <a href="#" onclick="switchTab('presets');return false;" id="nav-presets">🚗 車型</a>
        <a href="#" onclick="switchTab('services');return false;" id="nav-services">⚙️ 服務</a>
    </nav>

    <!-- 報價畫面 -->
    <div id="screen-new" class="content screen active">
        <div class="card">
            <h3>👤 客戶資訊</h3>
            <div class="form-group">
                <label class="form-label">姓名 *</label>
                <input type="text" id="customerName" class="form-input" placeholder="王先生">
            </div>
            <div class="form-group">
                <label class="form-label">電話</label>
                <input type="tel" id="customerPhone" class="form-input" placeholder="0912-345-678">
            </div>
            <div class="form-group">
                <label class="form-label">車牌</label>
                <input type="text" id="licensePlate" class="form-input" placeholder="ABC-1234">
            </div>
            <button class="btn btn-primary" onclick="alert('儲存成功!')">💾 儲存報價</button>
        </div>
    </div>

    <!-- 列表畫面 -->
    <div id="screen-list" class="content screen">
        <div class="card">
            <h3>📋 報價列表</h3>
            <p>目前沒有報價記錄</p>
        </div>
    </div>

    <!-- 車型畫面 -->
    <div id="screen-presets" class="content screen">
        <div class="card">
            <h3>🚗 車型快捷鍵</h3>
            <p>尚未設定車型</p>
        </div>
    </div>

    <!-- 服務畫面 -->
    <div id="screen-services" class="content screen">
        <div class="card">
            <h3>⚙️ 服務設定</h3>
            <p>尚未設定服務項目</p>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            // 隱藏所有畫面
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            // 顯示選中的畫面
            document.getElementById('screen-' + tab).classList.add('active');
            
            // 更新導航狀態
            document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
            document.getElementById('nav-' + tab).classList.add('active');
        }
    </script>
</body>
</html>
