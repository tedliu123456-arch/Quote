<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#1a3d34"/>
  
  <!-- Campground/RV icon - thicker lines -->
  <g stroke="#d4a853" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- RV body -->
    <rect x="80" y="180" width="352" height="220" rx="20" stroke-width="16"/>
    
    <!-- Roof -->
    <path d="M60 180 L256 80 L452 180" stroke-width="16"/>
    
    <!-- Window -->
    <rect x="100" y="220" width="120" height="80" rx="8" stroke-width="12"/>
    <rect x="240" y="220" width="80" height="80" rx="8" stroke-width="12"/>
    <rect x="340" y="220" width="70" height="80" rx="8" stroke-width="12"/>
    
    <!-- Door -->
    <rect x="220" y="280" width="60" height="120" rx="5" stroke-width="12"/>
    
    <!-- Wheels -->
    <circle cx="140" cy="420" r="45" stroke-width="16"/>
    <circle cx="140" cy="420" r="20" stroke-width="8"/>
    <circle cx="372" cy="420" r="45" stroke-width="16"/>
    <circle cx="372" cy="420" r="20" stroke-width="8"/>
    
    <!-- Solar panel on roof -->
    <rect x="180" y="100" width="152" height="50" rx="5" stroke-width="10"/>
    <line x1="210" y1="100" x2="210" y2="150" stroke-width="6"/>
    <line x1="256" y1="100" x2="256" y2="150" stroke-width="6"/>
    <line x1="302" y1="100" x2="302" y2="150" stroke-width="6"/>
  </g>
</svg>
