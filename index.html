<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a3d34">
    <meta name="version" content="20250224h">
    <title>凡構國際 報價系統</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script>
        // 版本檢查 - 強制更新
        const APP_VERSION = '20250224k';
        const savedVersion = localStorage.getItem('vango_version');
        
        if (savedVersion !== APP_VERSION) {
            localStorage.setItem('vango_version', APP_VERSION);
        }
    </script>
    <style>
        :root {
            --primary: #1a3d34;
            --primary-light: #2d5a4a;
            --accent: #d4a853;
            --accent-light: #f0d78c;
            --bg: #fdfbf7;
            --surface: #ffffff;
            --text: #2c2c2c;
            --text-muted: #6b6b6b;
            --danger: #e74c3c;
            --success: #27ae60;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
        
        /* App Header */
        .app-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white; padding: 14px 18px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(26,61,52,0.3);
            z-index: 999999 !important;
            position: relative;
        }
        
        .app-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .app-logo { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .app-phone { font-size: 12px; opacity: 0.9; }
        
        /* Content */
        .app-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 90px; -webkit-overflow-scrolling: touch; }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--surface);
            border-top: 1px solid rgba(212,168,83,0.2);
            display: flex !important; justify-content: space-around; padding: 10px 0 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 99999 !important;
        }
        
        .nav-item {
            display: flex !important; flex-direction: column; align-items: center;
            padding: 8px 20px; color: var(--text-muted); font-size: 11px;
            background: none; border: none; cursor: pointer !important;
            transition: all 0.2s; pointer-events: auto !important;
            -webkit-tap-highlight-color: transparent;
            z-index: 100000 !important;
            position: relative;
        }
        
        .nav-item.active { color: var(--primary); }
        .nav-item.active .nav-icon { background: var(--accent); color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--bg); transition: all 0.2s; }
        
        /* Cards */
        .card { background: var(--surface); border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .card-title { font-size: 15px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        /* Form */
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        .form-input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; background: var(--bg); transition: all 0.2s; }
        .form-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        /* Buttons */
        .btn { padding: 16px 24px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; box-shadow: 0 4px 15px rgba(26,61,52,0.3); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-accent { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); color: var(--primary); font-weight: 700; }
        .btn-accent:active { transform: scale(0.98); }
        .btn-block { width: 100%; }
        
        /* Service Grid */
        .service-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
        .service-item { padding: 14px 10px; background: var(--bg); border-radius: 14px; cursor: pointer; text-align: center; font-size: 12px; transition: all 0.2s; border: 2px solid transparent; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
        .service-item:active { background: var(--accent); transform: scale(0.98); }
        
        /* Items */
        .item-row { display: grid; grid-template-columns: 1fr 90px 75px 36px; gap: 8px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; align-items: center; }
        .item-input { padding: 10px; border: 2px solid #eee; border-radius: 10px; font-size: 13px; background: var(--bg); }
        .item-input:focus { border-color: var(--accent); }
        .item-delete { background: none; border: none; color: var(--danger); font-size: 20px; cursor: pointer; }
        
        /* Summary */
        .summary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; border-radius: 20px; padding: 20px; margin: 16px 0; box-shadow: 0 8px 25px rgba(26,61,52,0.3); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .summary-total { font-size: 22px; font-weight: 700; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 10px; margin-top: 10px; }
        
        /* Quote List */
        .quote-card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--accent); }
        .quote-customer { font-weight: 700; font-size: 16px; color: var(--primary); }
        .quote-vehicle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .quote-total { font-size: 18px; font-weight: 700; color: var(--accent); margin-top: 8px; }
        .quote-date { font-size: 11px; color: var(--text-muted); }
        
        /* Empty */
        .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        
        /* FAB */
        .fab { position: fixed; bottom: 90px; right: 20px; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); color: var(--primary); font-size: 28px; border: none; box-shadow: 0 6px 20px rgba(212,168,83,0.4); cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 9998; }
        .fab.show { display: flex; }
        
        /* Screen */
        .screen { display: none; z-index: 1; position: relative; }
        .screen.active { display: block; }
        
        /* Services List */
        .service-list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
        .service-name { font-size: 14px; flex: 1; }
        .service-price { color: var(--accent); font-weight: 700; min-width: 80px; text-align: right; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-title"></div>
        <div style="display:flex;align-items:center;gap:5px;">
            <button onclick="switchScreen('new')" id="tab-new" class="tab-btn active">📝</button>
            <button onclick="switchScreen('list')" id="tab-list" class="tab-btn">📋</button>
            <button onclick="switchScreen('presets')" id="tab-presets" class="tab-btn">🚗</button>
            <button onclick="switchScreen('services')" id="tab-services" class="tab-btn">⚙️</button>
        </div>
    </header>
    
    <style>
        .tab-btn {
            background: none !important; border: none !important; font-size: 18px; padding: 8px 12px; 
            cursor: pointer !important; opacity: 0.5; pointer-events: auto !important;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active { opacity: 1; background: var(--accent) !important; border-radius: 8px; }
    </style>
    
    <script>
        function clearCache() {
            if(confirm('清除快取並重新載入？\n\n这会刷新页面但保留您的报价记录。')) {
                localStorage.setItem('vango_version', APP_VERSION);
                location.reload();
            }
        }
    </script>
    
    <div class="app-content">
        <!-- New Quote -->
        <div id="screen-new" class="screen active">
            <div class="card">
                <div class="card-header"><div class="card-title">👤 客戶資訊</div></div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">姓名 *</label><input type="text" id="customerName" class="form-input" placeholder="王先生"></div>
                    <div class="form-group"><label class="form-label">電話</label><input type="tel" id="customerPhone" class="form-input" placeholder="0912-345-678"></div>
                </div>
                <div class="form-group"><label class="form-label">LINE ID</label><input type="text" id="customerLine" class="form-input" placeholder="line12345"></div>
                    <div class="form-group"><label class="form-label">統一編號</label><input type="text" id="customerTaxId" class="form-input" placeholder="12345678"></div>
                <div class="form-group"><label class="form-label">👤 業務</label><input type="text" id="salesPerson" class="form-input" placeholder="輸入業務姓名"></div>
                <div class="form-group">
                    <label class="form-label">車輛</label>
                    <div style="display:flex;gap:8px;">
                        <input type="text" id="vehicleInfo" class="form-input" placeholder="Toyota Hiace" style="flex:1;">
                        <select id="vehiclePreset" onchange="loadVehiclePreset()" style="padding:12px;border:2px solid var(--accent);border-radius:10px;font-size:14px;background:white;cursor:pointer;">
                            <option value="">🚗 快捷鍵</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">🚗 車牌號碼</label>
                    <input type="text" id="licensePlate" class="form-input" placeholder="例如：ABC-1234" style="text-transform:uppercase;">
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">📅 進廠日期</label><input type="date" id="entryDate" class="form-input"></div>
                    <div class="form-group"><label class="form-label">🚗 出廠日期</label><input type="date" id="exitDate" class="form-input"></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header"><div class="card-title">🔧 選擇服務</div></div>
                <div class="service-grid" id="serviceGrid"></div>
            </div>
            
            <div class="card">
                <div class="card-header"><div class="card-title">📝 已選項目 <span id="itemCount" style="font-weight:400;color:var(--text-muted);font-size:12px;">0</span></div></div>
                <div id="selectedItems"></div>
            </div>
            
            <div class="card">
                <div class="card-title">📝 備註</div>
                <textarea id="quoteNotes" class="form-input" style="min-height:80px;" placeholder="輸入備註說明..."></textarea>
            </div>
            
            <div class="summary">
                <div class="summary-row"><span>小計</span><span id="subtotal">$0</span></div>
                <div class="summary-row"><span>稅金 (5%)</span><span id="tax">$0</span></div>
                <div class="summary-row summary-total"><span>總計</span><span id="total">$0</span></div>
            </div>
            
            <div class="card">
                <div class="card-title">💰 訂金</div>
                <div class="form-group">
                    <input type="number" id="depositAmount" class="form-input" placeholder="輸入訂金金額" value="0" onchange="calculate()">
                </div>
                <div style="font-size:12px;color:var(--text-muted);">
                    尚欠金額：<span id="balanceAmount" style="color:var(--danger);font-weight:600;">$0</span>
                </div>
            </div>
            
            <button class="btn btn-primary btn-block" onclick="saveQuote()">💾 儲存報價</button>
            <button class="btn btn-accent btn-block" style="margin-top:10px;" onclick="generatePDF()">📄 產生 PDF</button>
        </div>
        
        <!-- List -->
        <div id="screen-list" class="screen">
            <div class="card" style="margin-bottom:10px;">
                <div style="display:flex;gap:8px;">
                    <input type="text" id="quoteSearch" class="form-input" placeholder="搜尋姓名、電話、车牌或车型..." oninput="filterQuotes()" onkeypress="if(event.key==='Enter'){filterQuotes()}" style="flex:1;">
                    <button onclick="filterQuotes()" style="background:var(--accent);color:var(--primary);border:none;padding:12px 16px;border-radius:12px;font-size:18px;cursor:pointer;">🔍</button>
                    <button onclick="scanLicensePlate()" style="background:var(--primary);color:white;border:none;padding:12px 16px;border-radius:12px;font-size:18px;cursor:pointer;">📷</button>
                </div>
            </div>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processImage(this)">
            <div id="scanResult" style="display:none;margin:10px;padding:15px;background:#fff;border-radius:8px;border:2px solid var(--primary);">
                <div style="font-size:16px;font-weight:bold;">📷 辨識結果：<span id="scannedPlate" style="color:var(--primary);"></span></div>
            </div>
            <div id="quotesList"></div>
        </div>
        
        <!-- Services -->
        <div id="screen-services" class="screen">
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">⚙️ 設定</div>
                <div class="form-group"><label class="form-label">營業稅 (%)</label><input type="number" id="taxRate" class="form-input" placeholder="5" value="5"></div>
                <button class="btn btn-primary btn-block" onclick="saveSettings()">儲存設定</button>
            </div>
            
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">📷 車牌資料庫</div>
                <div id="unknownPlatesList" style="max-height:200px;overflow-y:auto;"></div>
            </div>
            
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">➕ 新增服務</div>
                <div class="form-group"><input type="text" id="newServiceName" class="form-input" placeholder="服務名稱"></div>
                <div class="form-group"><input type="number" id="newServicePrice" class="form-input" placeholder="價格"></div>
                <button class="btn btn-primary btn-block" onclick="addNewService()">新增</button>
            </div>
            
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">📋 服務項目</div>
                <div id="allServices"></div>
            </div>
        </div>
        
        <!-- Presets -->
        <div id="screen-presets" class="screen">
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">🚗 車型快捷鍵</div>
                <div class="form-group"><input type="text" id="presetName" class="form-input" placeholder="輸入車型名稱 (如：福斯加州號)"></div>
                <div id="presetItemsList" style="margin:10px 0;"></div>
                <div style="margin:10px 0;">
                    <div class="card-title" style="font-size:14px;margin-bottom:8px;">📋 選擇服務項目</div>
                    <div id="presetServicesList"></div>
                </div>
                <button class="btn btn-primary btn-block" onclick="savePreset()">💾 儲存為快捷鍵</button>
            </div>
            
            <div class="card">
                <div class="card-title" style="margin-bottom:14px;">📂 已儲存的車型</div>
                <div id="presetsList"></div>
            </div>
        </div>
    </div>
    
    <button class="fab" id="fab" onclick="addNewItem()">+</button>

    <script>
        let services = JSON.parse(localStorage.getItem('vango_services')) || [
            {name:'太陽能200W',price:12000},{name:'太陽能400W',price:22000},{name:'鋰電100AH',price:18000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'Inverter',price:15000},{name:'USB座',price:1200},{name:'12V冰箱',price:12000},{name:'LED燈組',price:3500},{name:'工資(基本)',price:5000},{name:'工資(專業)',price:8000}
        ];
        
        let quotes = JSON.parse(localStorage.getItem('vango_quotes')) || [];
        let selectedItems = [];
        let editingQuoteIndex = null;
        let taxRate = parseFloat(localStorage.getItem('vango_taxRate')) || 5;
        
        document.addEventListener('DOMContentLoaded', () => { 
            try {
                renderServices(); 
                renderAllServices(); 
                renderQuotes();
                renderPresets();
                renderVehiclePresets();
                document.getElementById('taxRate').value = taxRate;
            } catch(e) {
                console.error('Init error:', e);
            }
        });
        
        function renderVehiclePresets() {
            const select = document.getElementById('vehiclePreset');
            if(presets.length > 0) {
                select.innerHTML = '<option value="">🚗 快捷鍵</option>' + 
                    presets.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
            }
        }
        
        function loadVehiclePreset() {
            const idx = document.getElementById('vehiclePreset').value;
            if(idx !== '') {
                const p = presets[idx];
                document.getElementById('vehicleInfo').value = p.name;
                selectedItems = p.items.map(i => ({...i, qty: 1, id: Date.now() + Math.random()}));
                renderItems();
                calculate();
                // 重置選項
                document.getElementById('vehiclePreset').value = '';
            }
        }
        
        function saveSettings() {
            taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
            localStorage.setItem('vango_taxRate', taxRate);
            alert('設定已儲存！稅率：' + taxRate + '%');
            calculate();
        }
        
        function switchScreen(screen) {
            // 簡單測試版
            const screens = document.querySelectorAll('.screen');
            for(let s of screens) { s.style.display = 'none'; }
            
            const target = document.getElementById('screen-' + screen);
            if(target) { target.style.display = 'block'; }
            
            const tabs = document.querySelectorAll('.tab-btn');
            for(let t of tabs) { t.classList.remove('active'); }
            
            const tab = document.getElementById('tab-' + screen);
            if(tab) { tab.classList.add('active'); }
            
            alert('切換完成: ' + screen);
        }
        
        function renderUnknownPlates() {
            const container = document.getElementById('unknownPlatesList');
            const plates = JSON.parse(localStorage.getItem('vango_unknown_plates')) || [];
            
            if(plates.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:10px;">尚無資料</div>';
                return;
            }
            
            container.innerHTML = plates.map((p, i) => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:8px;">
                    <span style="font-weight:bold;font-size:14px;">🚗 ${p.plate}</span>
                    <button onclick="deleteUnknownPlate(${i})" style="background:var(--danger);color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;">🗑️</button>
                </div>
            `).join('');
        }
        
        function deleteUnknownPlate(index) {
            if(confirm('確定要刪除？')) {
                let plates = JSON.parse(localStorage.getItem('vango_unknown_plates')) || [];
                plates.splice(index, 1);
                localStorage.setItem('vango_unknown_plates', JSON.stringify(plates));
                renderUnknownPlates();
            }
        }
        
        function renderServices() {
            const grid = document.getElementById('serviceGrid');
            grid.innerHTML = services.map((s, i) => 
                `<div class="service-item" onclick="addItem(${i})">${s.name}<br><strong>$${s.price.toLocaleString()}</strong></div>`
            ).join('');
        }
        
        function renderAllServices() {
            const list = document.getElementById('allServices');
            list.innerHTML = services.map((s, i) => 
                `<div class="service-list-item">
                    <span class="service-name">${s.name}</span>
                    <span class="service-price">$${s.price.toLocaleString()}</span>
                    <div style="min-width:70px;text-align:right;">
                        <button onclick="editService(${i})" style="background:var(--accent);color:var(--primary);border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:14px;margin-right:4px;">✏️</button>
                        <button class="item-delete" onclick="deleteService(${i})" style="font-size:16px;padding:4px 8px;">🗑️</button>
                    </div>
                </div>`
            ).join('');
        }
        
        function editService(index) {
            const s = services[index];
            const newName = prompt('編輯服務名稱：', s.name);
            if(newName === null) return;
            const newPrice = prompt('編輯服務價格：', s.price);
            if(newPrice === null) return;
            
            services[index] = {name: newName.trim(), price: parseInt(newPrice) || 0};
            localStorage.setItem('vango_services', JSON.stringify(services));
            renderServices();
            renderAllServices();
            alert('已更新！');
        }
        
        function deleteService(index) {
            if(confirm('確定要刪除「' + services[index].name + '」？')) {
                services.splice(index, 1);
                localStorage.setItem('vango_services', JSON.stringify(services));
                renderServices();
                renderAllServices();
            }
        }
        
        function addItem(index) {
            const s = services[index];
            selectedItems.push({...s, qty: 1, id: Date.now()});
            renderItems();
        }
        
        function addNewItem() {
            const name = prompt('項目名稱:');
            if(!name) return;
            const price = parseInt(prompt('價格:') || '0');
            if(price > 0) selectedItems.push({name, price, qty: 1, id: Date.now()});
            renderItems();
        }
        
        function removeItem(id) {
            selectedItems = selectedItems.filter(i => i.id !== id);

        function calculate() {
            let subtotal = selectedItems.reduce((sum, i) => sum + i.price * i.qty, 0);
            let tax = Math.round(subtotal * (taxRate / 100));
            let total = subtotal + tax;
            let deposit = parseInt(document.getElementById('depositAmount').value) || 0;
            let balance = total - deposit;
            
            document.getElementById('subtotal').textContent = '$' + subtotal.toLocaleString();
            document.getElementById('tax').textContent = '$' + tax.toLocaleString() + ' (' + taxRate + '%)';
            document.getElementById('total').textContent = '$' + total.toLocaleString();
            document.getElementById('balanceAmount').textContent = '$' + balance.toLocaleString();
            
            return {subtotal, tax, total, deposit, balance};
        }

        function recognizeWithAPI(canvas) {
            const liveResult = document.getElementById('livePlateResult');
            liveResult.innerHTML = '🔄 Plate Recognizer API 增強辨識中...';
            
            // 建立多個影像版本進行處理
            const processImage = (srcCanvas, flip) => {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = srcCanvas.width;
                tempCanvas.height = srcCanvas.height;
                
                if (flip) {
                    tempCtx.translate(tempCanvas.width, 0);
                    tempCtx.scale(-1, 1);
                }
                tempCtx.drawImage(srcCanvas, 0, 0);
                
                return tempCanvas.toDataURL('image/jpeg', 0.95).split(',')[1];
            };
            
            // 生成影像版本
            const imageVersions = [
                { img: processImage(canvas, false), name: '原始' },
                { img: processImage(canvas, true), name: '翻轉' }
            ];
            
            // API 請求
            const apiRequests = [];
            
            imageVersions.forEach(version => {
                // 台灣 (主要)
                apiRequests.push(
                    fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Token 0855c1beecd58a6ff41d646f521439dc532f9a74',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            image: version.img,
                            regions: ['tw'],
                            detect_vehicle: 0
                        })
                    }).then(r => r.json())
                );
            });
            
            Promise.all(apiRequests)
            .then(results => {
                console.log('API 回應數量:', results.length);
                
                // 合併所有結果
                let allCandidates = [];
                
                results.forEach(data => {
                    if (data.results && data.results.length > 0) {
                        data.results.forEach(result => {
                            allCandidates.push({
                                plate: result.plate.toUpperCase(),
                                score: result.score || 0,
                                box: result.box
                            });
                        });
                    }
                });
                
                // 去重並排序
                let uniqueCandidates = [];
                let seen = new Set();
                
                allCandidates.forEach(c => {
                    let cleanPlate = c.plate.replace(/[^A-Z0-9]/g, '');
                    if (!seen.has(cleanPlate) && cleanPlate.length >= 4) {
                        seen.add(cleanPlate);
                        uniqueCandidates.push({
                            original: c.plate,
                            clean: cleanPlate,
                            score: c.score
                        });
                    }
                });
                
                // 按置信度排序
                uniqueCandidates.sort((a, b) => b.score - a.score);
                
                if (uniqueCandidates.length > 0) {
                    // 格式化並顯示候選 (最多5個)
                    let displayCandidates = uniqueCandidates.slice(0, 5).map((c, i) => {
                        let formatted = formatPlate(c.clean);
                        return { ...c, formatted };
                    });
                    
                    showPlateCandidates(displayCandidates);
                } else {
                    // API 沒結果，使用本地辨識
                    performRecognition(canvas);
                }
            })
            .catch(err => {
                console.log('API 請求錯誤:', err);
                performRecognition(canvas);
            });
        }
        
        function formatPlate(plate) {
            // 格式化車牌
            plate = plate.replace(/[^A-Z0-9]/g, '');
            if (plate.length >= 5) {
                if (plate.length <= 4) {
                    return plate;
                } else if (plate.length <= 5) {
                    return plate.substring(0, 2) + '-' + plate.substring(2);
                } else if (plate.length <= 6) {
                    return plate.substring(0, 3) + '-' + plate.substring(3);
                } else {
                    return plate.substring(0, 3) + '-' + plate.substring(3, 7);
                }
            }
            return plate;
        }

        function performRecognition(canvas) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // 車牌區域預設在中間
            const plateRegion = {
                x: width * 0.2,
                y: height * 0.3,
                w: width * 0.6,
                h: height * 0.25
            };
            
            // 解析車牌
            const parsePlate = (text) => {
                let cleaned = text.toUpperCase().replace(/[^A-Z0-9]/g, '');
                // 限制最多8碼
                if (cleaned.length > 8) cleaned = cleaned.substring(0, 8);
                
                // 台灣車牌格式
                const patterns = [
                    /^([A-Z]{2,3})(\d{3,4})$/,  // ABC-1234 或 AB-1234
                    /^(\d{3,4})([A-Z]{2,3})$/,  // 1234-ABC
                    /^([A-Z])(\d{4})$/,        // A-1234
                    /^(\d{4})([A-Z])$/,        // 1234-A
                ];
                
                for (const pattern of patterns) {
                    const match = cleaned.match(pattern);
                    if (match) {
                        return match[1] + '-' + match[2];
                    }
                }
                
                // 沒有匹配到格式，直接格式化
                if (cleaned.length >= 5) {
                    if (cleaned.length <= 4) {
                        return cleaned;
                    } else if (cleaned.length <= 6) {
                        return cleaned.substring(0, cleaned.length - 3) + '-' + cleaned.substring(cleaned.length - 3);
                    } else {
                        return cleaned.substring(0, 3) + '-' + cleaned.substring(3, 7);
                    }
                }
                return cleaned;
            };
            
            // 影像預處理
            const preprocessImage = (imgData, contrast, brightness) => {
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                    const adjusted = ((gray - 128) * contrast) + 128 + brightness;
                    const val = Math.max(0, Math.min(255, adjusted));
                    data[i] = data[i + 1] = data[i + 2] = val;
                }
            };
            
            // 建立多個預處理版本
            const processVersions = [];
            
            // 原始
            let imgData = ctx.getImageData(0, 0, width, height);
            processVersions.push({ data: imgData, name: 'original' });
            
            // 高對比
            imgData = ctx.getImageData(plateRegion.x, plateRegion.y, plateRegion.w, plateRegion.h);
            preprocessImage(imgData, 2.0, 0);
            processVersions.push({ data: imgData, name: 'highContrast' });
            
            // 明亮
            imgData = ctx.getImageData(plateRegion.x, plateRegion.y, plateRegion.w, plateRegion.h);
            preprocessImage(imgData, 1.5, 30);
            processVersions.push({ data: imgData, name: 'bright' });
            
            // 二值化
            imgData = ctx.getImageData(plateRegion.x, plateRegion.y, plateRegion.w, plateRegion.h);
            preprocessImage(imgData, 2.5, -30);
            processVersions.push({ data: imgData, name: 'binary' });
            
            // 裁剪車牌區域
            const cropPlateRegion = (fullCanvas, region) => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = region.w;
                tempCanvas.height = region.h;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(fullCanvas, region.x, region.y, region.w, region.h, 0, 0, region.w, region.h);
                return tempCanvas.toDataURL('image/jpeg', 0.9);
            };
            
            // 進行多次辨識
            const recognitionPromises = [];
            
            for (const version of processVersions) {
                // 裁剪車牌區域
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = plateRegion.w;
                tempCanvas.height = plateRegion.h;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.putImageData(version.data, 0, 0);
                const croppedUrl = tempCanvas.toDataURL('image/jpeg', 0.9);
                
                // 全畫面辨識
                recognitionPromises.push(
                    Tesseract.recognize(croppedUrl, 'eng', {
                        logger: m => {},
                        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                        tessedit_pageseg_mode: '6'
                    })
                );
            }
            
            // 全畫面辨識
            recognitionPromises.push(
                Tesseract.recognize(canvas.toDataURL('image/jpeg', 0.8), 'eng', {
                    logger: m => {},
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                    tessedit_pageseg_mode: '3'
                })
            );
            
            Promise.all(recognitionPromises).then(results => {
                let bestPlate = '';
                let bestConfidence = 0;
                
                for (const result of results) {
                    const text = result.data.text;
                    const plate = parsePlate(text);
                    
                    // 修正常見OCR錯誤
                    let corrected = plate
                        .replace(/O/g, '0').replace(/Q/g, '0')
                        .replace(/Z/g, '2').replace(/S/g, '5')
                        .replace(/B/g, '8').replace(/I/g, '1')
                        .replace(/L/g, '1').replace(/U/g, '0')
                        .replace(/D/g, '0').replace(/G/g, '6')
                        .replace(/T/g, '7').replace(/Y/g, '7')
                        .replace(/K/g, '8');
                    
                    // 限制長度
                    corrected = corrected.replace(/[^A-Z0-9\-]/g, '');
                    if (corrected.length > 8) corrected = corrected.substring(0, 8);
                    
                    const confidence = result.data.confidence;
                    
                    if (corrected.length >= 5 && confidence > bestConfidence) {
                        bestConfidence = confidence;
                        bestPlate = corrected;
                    }
                }
                
                const liveResult = document.getElementById('livePlateResult');
                
                if (bestPlate && bestPlate.length >= 5) {
                    liveResult.innerHTML = '🚗 辨識結果：<span style="font-size:24px;">' + bestPlate + '</span>';
                    liveResult.style.background = '#e8f5e9';
                    
                    // 自動填入
                    document.getElementById('licensePlate').value = bestPlate;
                    document.getElementById('quoteSearch').value = bestPlate;
                    filterQuotes();
                    
                    // 顯示重新拍照按鈕
                    liveResult.innerHTML += '<div style="margin-top:15px;"><button onclick="retakePhoto()" style="background:var(--primary);color:white;border:none;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer;">🔄 重新拍照</button> <button onclick="confirmPlate()" style="background:#4CAF50;color:white;border:none;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer;margin-left:10px;">✓ 確認</button></div>';
                } else {
                    liveResult.innerHTML = '⚠️ 辨識失敗<br><span style="font-size:14px;">請重新拍攝或手動輸入</span>';
                    liveResult.style.background = '#ffebee';
                    liveResult.innerHTML += '<div style="margin-top:15px;"><button onclick="retakePhoto()" style="background:var(--primary);color:white;border:none;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer;">🔄 重新拍照</button></div>';
                }
                
            }).catch(err => {
                const liveResult = document.getElementById('livePlateResult');
                liveResult.innerHTML = '⚠️ 辨識錯誤，請重新拍攝';
                liveResult.style.background = '#ffebee';
                liveResult.innerHTML += '<div style="margin-top:15px;"><button onclick="retakePhoto()" style="background:var(--primary);color:white;border:none;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer;">🔄 重新拍照</button></div>';
            });
        }

                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            const scanResult = document.getElementById('scanResult');
            scanResult.style.display = 'none';

        function processImage(input) {
            if (!input.files || !input.files[0]) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            // 預處理
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const contrast = 2.0;
                const adjusted = ((gray - 128) * contrast) + 128;
                const val = Math.max(0, Math.min(255, adjusted));
                data[i] = data[i + 1] = data[i + 2] = val;
            }
            ctx.putImageData(imageData, 0, 0);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            // 進行高精確度辨識
            document.getElementById('livePlateResult').textContent = '🔄 最終辨識中...';
            
            Promise.all([
                Tesseract.recognize(dataUrl, 'eng', { tessedit_pageseg_mode: '6' }),
                Tesseract.recognize(canvas.toDataURL('image/jpeg', 0.7), 'eng', { tessedit_pageseg_mode: '3' })
            ]).then(results => {
                const parsePlate = (text) => {
                    let cleaned = text.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
                    const patterns = [
                        /([A-Z]{1,3})[\-\s]*([0-9]{3,4})/,
                        /([0-9]{3,4})[\-\s]*([A-Z]{1,3})/,
                    ];
                    for (const pattern of patterns) {
                        const match = cleaned.match(pattern);
                        if (match) {
                            let plate = match[1] + '-' + match[2];
                            plate = plate.replace(/O/g, '0').replace(/Q/g, '0')
                                         .replace(/Z/g, '2').replace(/S/g, '5')
                                         .replace(/B/g, '8').replace(/I/g, '1')
                                         .replace(/L/g, '1').replace(/U/g, '0');
                            return plate;
                        }
                    }
                    return cleaned;
                };
                
                let bestPlate = '';
                for (const result of results) {
                    const plate = parsePlate(result.data.text);
                    if (plate && plate.length >= 5) {
                        bestPlate = plate;
                        break;
                    }
                }
                
                stopCamera();
                
                if (bestPlate && bestPlate.length >= 5) {
                    document.getElementById('licensePlate').value = bestPlate;
                    document.getElementById('quoteSearch').value = bestPlate;
                    filterQuotes();
                    alert('📷 辨識成功：' + bestPlate);
                } else {
                    alert('⚠️ 辨識失敗，請手動輸入');
                }
            });
        }
        
        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            const scanResult = document.getElementById('scanResult');
            scanResult.style.display = 'none';
            scanResult.innerHTML = '';
        }
        
        function processImage(input) {
            if (!input.files || !input.files[0]) return;
            
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                document.getElementById('scanResult').style.display = 'block';
                document.getElementById('scannedPlate').textContent = '辨识中...';
                
                const img = new Image();
                img.onload = function() {
                    // 建立多個處理後的影像進行辨識
                    const processImage = (processedDataUrl, label) => {
                        return Tesseract.recognize(processedDataUrl, 'eng', {
                            logger: m => {},
                            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
                            tessedit_pageseg_mode: '6'  // 單一文字區塊模式
                        });
                    };
                    
                    // 影像預處理函數
                    const preprocessImage = (ctx, width, height, contrast, brightness) => {
                        const imageData = ctx.getImageData(0, 0, width, height);
                        const data = imageData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            // 轉灰階
                            const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                            // 調整亮度和對比
                            const adjusted = ((gray - 128) * contrast) + 128 + brightness;
                            const val = Math.max(0, Math.min(255, adjusted));
                            data[i] = data[i + 1] = data[i + 2] = val;
                        }
                        ctx.putImageData(imageData, 0, 0);
                    };
                    
                    // 解析車牌文字
                    const parsePlate = (text) => {
                        let cleaned = text.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
                        
                        // 台灣車牌格式: ABC-1234 或 1234-ABC 或 AB-1234
                        const patterns = [
                            /([A-Z]{1,3})[\-\s]*([0-9]{3,4})/,  // ABC-1234 或 AB-1234
                            /([0-9]{3,4})[\-\s]*([A-Z]{1,3})/,  // 1234-ABC
                            /([A-Z]{2})[\-\s]*([0-9]{4})/,      // AB-1234
                        ];
                        
                        for (const pattern of patterns) {
                            const match = cleaned.match(pattern);
                            if (match) {
                                let plate = match[1] + '-' + match[2];
                                // 修正常見OCR錯誤
                                plate = plate
                                    .replace(/O/g, '0').replace(/Q/g, '0')
                                    .replace(/Z/g, '2').replace(/S/g, '5')
                                    .replace(/B/g, '8').replace(/I/g, '1')
                                    .replace(/L/g, '1').replace(/U/g, '0')
                                    .replace(/D/g, '0').replace(/G/g, '6')
                                    .replace(/T/g, '7');
                                return plate;
                            }
                        }
                        
                        // 如果沒有匹配到格式，嘗試取出連續的字母和數字
                        const allMatches = cleaned.match(/[A-Z]+|[0-9]+/g);
                        if (allMatches && allMatches.length >= 2) {
                            const letters = allMatches.find(m => /[A-Z]/.test(m)) || '';
                            const numbers = allMatches.find(m => /[0-9]/.test(m)) || '';
                            if (letters && numbers) {
                                return letters.substring(0, 3) + '-' + numbers.substring(0, 4);
                            }
                        }
                        return cleaned;
                    };
                    
                    // 建立不同參數的影像進行辨識
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // 處理1: 高對比
                    ctx.drawImage(img, 0, 0);
                    preprocessImage(ctx, canvas.width, canvas.height, 1.8, 0);
                    const highContrast = canvas.toDataURL('image/jpeg', 0.9);
                    
                    // 處理2: 明亮
                    ctx.drawImage(img, 0, 0);
                    preprocessImage(ctx, canvas.width, canvas.height, 1.2, 30);
                    const brightened = canvas.toDataURL('image/jpeg', 0.9);
                    
                    // 處理3: 二值化
                    ctx.drawImage(img, 0, 0);
                    preprocessImage(ctx, canvas.width, canvas.height, 2.0, -20);
                    const binary = canvas.toDataURL('image/jpeg', 0.9);
                    
                    // 同時進行多個辨識
                    Promise.all([
                        processImage(highContrast, 'highContrast'),
                        processImage(brightened, 'brightened'),
                        processImage(binary, 'binary'),
                        processImage(e.target.result, 'original')
                    ]).then(results => {
                        // 找出最佳結果
                        let bestPlate = '';
                        let bestConfidence = 0;
                        
                        for (const result of results) {
                            const text = result.data.text;
                            const confidence = result.data.confidence;
                            const plate = parsePlate(text);
                            
                            if (plate.length >= 5 && plate.length <= 8) {
                                if (confidence > bestConfidence) {
                                    bestConfidence = confidence;
                                    bestPlate = plate;
                                }
                            }
                        }
                        
                        // 如果沒有好結果，嘗試原始辨識
                        if (!bestPlate || bestPlate.length < 5) {
                            const lastResult = results[results.length - 1];
                            bestPlate = parsePlate(lastResult.data.text);
                        }
                        
                        document.getElementById('scannedPlate').textContent = bestPlate || '无法辨识';
                        if (bestPlate && bestPlate.length >= 5) {
                            document.getElementById('quoteSearch').value = bestPlate;
                            document.getElementById('licensePlate').value = bestPlate;
                            filterQuotes();
                            alert('📷 辨識結果：' + bestPlate);
                        } else {
                            alert('⚠️ 辨識失敗，請手動輸入車牌');
                        }
                    }).catch(err => {
                        document.getElementById('scannedPlate').textContent = '请手动输入';
                        alert('⚠️ 辨識失敗，請手動輸入車牌');
                    });
                };
                img.src = e.target.result;
            };
            
            reader.readAsDataURL(file);
        }

        function saveUnmatchedPlate(plate) {
            // 取得現有資料
            let plates = JSON.parse(localStorage.getItem('vango_unknown_plates')) || [];
            
            // 檢查是否已存在
            const exists = plates.find(p => p.plate === plate);
            if (!exists) {
                plates.push({

                    date: new Date().toISOString()

            document.getElementById('customerTaxId').value = '';
            document.getElementById('vehicleInfo').value = '';
            document.getElementById('licensePlate').value = '';
            document.getElementById('entryDate').value = '';
            document.getElementById('exitDate').value = '';
            document.getElementById('salesPerson').value = '';
            document.getElementById('quoteNotes').value = '';
            document.getElementById('depositAmount').value = '0';
            selectedItems = [];
            editingQuoteIndex = null;
            renderItems();
            calculate();
        }
        
        function addNewService() {
            const name = document.getElementById('newServiceName').value.trim();
            const price = parseInt(document.getElementById('newServicePrice').value) || 0;
            if(name && price > 0) {
                services.push({name, price});
                localStorage.setItem('vango_services', JSON.stringify(services));
                renderServices();
                renderAllServices();
                document.getElementById('newServiceName').value = '';
                document.getElementById('newServicePrice').value = '';
            }
        }
        
        // 車型快捷鍵功能
        let presets = JSON.parse(localStorage.getItem('vango_presets')) || [
            {name:'VW Ocean 6.1', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'VW Beach 6.1', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'Marco Polo', items:[{name:'太陽能系統 600W',price:28000},{name:'鋰電300AH',price:42000},{name:'配電系統',price:10000},{name:'inverter',price:18000},{name:'USB座',price:2400},{name:'LED燈組',price:5000}]},
            {name:'Sunlight 600rt', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'Sunlight 600', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'Sunlight 601', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]},
            {name:'Sunlight T67s', items:[{name:'太陽能系統 600W',price:28000},{name:'鋰電300AH',price:42000},{name:'配電系統',price:10000},{name:'inverter',price:18000},{name:'USB座',price:2400},{name:'LED燈組',price:5000}]},
            {name:'Sunlight T58', items:[{name:'太陽能系統 400W',price:22000},{name:'鋰電200AH',price:32000},{name:'配電系統',price:8000},{name:'inverter',price:15000},{name:'USB座',price:1200},{name:'LED燈組',price:3500}]}
        ];
        
        // 第一次載入時儲存到 localStorage
        if(!localStorage.getItem('vango_presets')) {
            localStorage.setItem('vango_presets', JSON.stringify(presets));
        }
        
        function renderPresets() {
            const container = document.getElementById('presetsList');
            if(presets.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:10px;">尚無儲存的車型</div>';
                return;
            }
            container.innerHTML = presets.map((p, i) => `
                <div class="service-list-item">
                    <span class="service-name">🚗 ${p.name} (${p.items.length}項)</span>
                    <div>
                        <button onclick="loadPreset(${i})" style="background:var(--primary);color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;">➕</button>
                        <button onclick="editPreset(${i})" style="background:var(--accent);color:var(--primary);border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;margin-left:4px;">✏️</button>
                        <button onclick="deletePreset(${i})" style="background:var(--danger);color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;margin-left:4px;">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
        
        let editingPresetIndex = null;
        let presetItems = [];
        
        function renderPresetServicesList() {
            const container = document.getElementById('presetServicesList');
            container.innerHTML = services.map((s, i) => 
                `<button onclick="addItemToPreset(${i})" style="background:var(--primary);color:white;border:none;padding:6px 10px;border-radius:15px;cursor:pointer;font-size:11px;margin:3px;white-space:nowrap;">${s.name}</button>`
            ).join('');
        }
        
        function addItemToPreset(serviceIndex) {
            const s = services[serviceIndex];
            presetItems.push({name: s.name, price: s.price});
            renderPresetItemsList();
        }
        
        function removeItemFromPreset(index) {
            presetItems.splice(index, 1);
            renderPresetItemsList();
        }
        
        function renderPresetItemsList() {
            const container = document.getElementById('presetItemsList');
            if(presetItems.length === 0) {
                container.innerHTML = '<p style="font-size:12px;color:#999;text-align:center;padding:10px;">尚無選擇項目，點擊下方服務項目新增</p>';
                return;
            }
            let html = '<div style="background:#f5f5f5;border-radius:8px;padding:10px;margin-bottom:10px;">';
            html += '<div style="font-size:12px;color:#666;margin-bottom:8px;">已選擇 ' + presetItems.length + ' 項：</div>';
            html += presetItems.map((item, i) => 
                `<div style="display:flex;justify-content:space-between;align-items:center;background:white;padding:8px;border-radius:6px;margin-bottom:5px;">
                    <span>${item.name} - $${item.price.toLocaleString()}</span>
                    <button onclick="removeItemFromPreset(${i})" style="background:var(--danger);color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;">✕</button>
                </div>`
            ).join('');
            html += '<button onclick="presetItems=[];renderPresetItemsList()" style="background:#999;color:white;border:none;padding:8px;width:100%;border-radius:6px;cursor:pointer;margin-top:5px;">🗑️ 清空</button>';
            html += '</div>';
            container.innerHTML = html;
        }
        
        function editPreset(index) {
            const p = presets[index];
            editingPresetIndex = index;
            presetItems = p.items.map(i => ({name: i.name, price: i.price}));
            renderPresetItemsList();
            
            // 顯示編輯區塊
            let itemsHtml = '<div style="margin-top:15px;">';
            p.items.forEach((item, i) => {
                itemsHtml += `
                    <div style="display:flex;gap:5px;margin-bottom:8px;align-items:center;">
                        <input type="text" id="edit-item-name-${i}" value="${item.name}" style="flex:2;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                        <input type="number" id="edit-item-price-${i}" value="${item.price}" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                        <button onclick="removePresetItem(${i})" style="background:var(--danger);color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">✕</button>
                    </div>
                `;
            });
            itemsHtml += `
                <button onclick="addPresetItem()" style="background:var(--accent);color:var(--primary);border:none;padding:8px 16px;border-radius:6px;cursor:pointer;width:100%;margin-top:5px;">➕ 新增項目</button>
            </div>`;
            
            // 顯示名稱編輯
            const newName = prompt('編輯車型名稱：', p.name);
            if(newName === null) return;
            
            p.name = newName.trim() || p.name;
            
            // 顯示編輯面板
            const container = document.getElementById('presetsList');
            container.innerHTML = `
                <div style="background:var(--primary);color:white;padding:15px;border-radius:8px;margin-bottom:10px;">
                    <strong>🚗 編輯中：${p.name}</strong>
                </div>
                <div style="padding:10px;background:#f5f5f5;border-radius:8px;">
                    <label style="font-size:12px;color:#666;">項目名稱</label>
                    <label style="font-size:12px;color:#666;float:right;">金額</label>
                    ${itemsHtml}
                    <div style="display:flex;gap:10px;margin-top:15px;">
                        <button onclick="savePresetEdit()" style="background:var(--primary);color:white;border:none;padding:12px;border-radius:6px;cursor:pointer;flex:1;font-weight:bold;">💾 儲存</button>
                        <button onclick="cancelPresetEdit()" style="background:#999;color:white;border:none;padding:12px;border-radius:6px;cursor:pointer;flex:1;">✕ 取消</button>
                    </div>
                </div>
            `;
        }
        
        function removePresetItem(itemIndex) {
            const p = presets[editingPresetIndex];
            p.items.splice(itemIndex, 1);
            editPreset(editingPresetIndex); // 重新渲染
        }
        
        function addPresetItem() {
            const p = presets[editingPresetIndex];
            p.items.push({name: '新項目', price: 0});
            editPreset(editingPresetIndex); // 重新渲染
        }
        
        function savePresetEdit() {
            const p = presets[editingPresetIndex];
            // 收集所有編輯的值
            const newItems = [];
            p.items.forEach((item, i) => {
                const name = document.getElementById('edit-item-name-' + i).value.trim();
                const price = parseInt(document.getElementById('edit-item-price-' + i).value) || 0;
                if(name) {
                    newItems.push({name, price});
                }
            });
            p.items = newItems;
            presetItems = newItems;
            localStorage.setItem('vango_presets', JSON.stringify(presets));
            editingPresetIndex = null;
            renderPresets();
            renderVehiclePresets();
            renderPresetItemsList();
            alert('已儲存車型！');
        }
        
        function cancelPresetEdit() {
            editingPresetIndex = null;
            presetItems = [];
            renderPresets();
            renderVehiclePresets();
            renderPresetItemsList();
        }
        
        function savePreset() {
            const name = document.getElementById('presetName').value.trim();
            if(!name) { alert('請輸入車型名稱'); return; }
            if(presetItems.length === 0) { alert('請先選擇服務項目'); return; }
            
            const preset = {
                name: name,
                items: presetItems.map(i => ({name: i.name, price: i.price}))
            };
            
            presets.push(preset);
            localStorage.setItem('vango_presets', JSON.stringify(presets));
            presetItems = [];
            renderPresetItemsList();
            renderPresets();
            renderVehiclePresets();
            document.getElementById('presetName').value = '';
            alert('已儲存「' + name + '」快捷鍵！');
        }
        
        function loadPreset(index) {
            const p = presets[index];
            selectedItems = p.items.map(i => ({...i, qty: 1, id: Date.now() + Math.random()}));
            document.getElementById('vehicleInfo').value = p.name;
            renderItems();
            calculate();
            switchScreen('new');
            alert('已載入「' + p.name + '」的服務項目！');
        }
        
        function deletePreset(index) {
            presets.splice(index, 1);
            localStorage.setItem('vango_presets', JSON.stringify(presets));
            renderPresets();
            renderVehiclePresets();
        }
        
        async function generatePDF() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            if(!name) { alert('請填寫姓名'); return; }
            if(selectedItems.length === 0) { alert('請選擇服務項目'); return; }
            
            const {subtotal, tax, total} = calculate();
            const line = document.getElementById('customerLine').value.trim();
            const taxId = document.getElementById('customerTaxId').value.trim();
            const vehicle = document.getElementById('vehicleInfo').value.trim();
            const entryDate = document.getElementById('entryDate').value;
            const exitDate = document.getElementById('exitDate').value;
            const salesPerson = document.getElementById('salesPerson').value.trim();
            const notes = document.getElementById('quoteNotes').value.trim();
            const deposit = parseInt(document.getElementById('depositAmount').value) || 0;
            
            const quoteDate = new Date().toLocaleDateString('zh-TW');
            const quoteId = 'VQ' + Date.now();
            
            let itemsHtml = selectedItems.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td style="text-align:center;">${item.qty}</td>
                    <td style="text-align:right;">$${(item.price * item.qty).toLocaleString()}</td>
                </tr>
            `).join('');
            
            const pdfContent = `
                <div style="font-family: 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; padding: 20px; color: #2c2c2c;">
                    <div style="text-align:center;margin-bottom:20px;">
                        <h1 style="color:#1a3d34;margin:0;">🏕️ 凡構國際實業社</h1>
                        <p style="color:#666;margin:5px 0;">露營車駐車冷氣 配電專門</p>
                        <p style="color:#666;margin:5px 0;">📞 0912-678-660 | LINE: @0912678660</p>
                    </div>
                    
                    <div style="display:flex;justify-content:space-between;margin:15px 0;padding:10px;background:#f5f5f5;border-radius:8px;">
                        <span>📅 日期：${quoteDate}</span>
                        <span>📋 單號：${quoteId}</span>
                    </div>
                    
                    <div style="padding:15px;background:#fdfbf7;border-radius:8px;margin-bottom:15px;">
                        <h3 style="color:#1a3d34;margin:0 0 10px 0;">客戶資訊</h3>
                        <p style="margin:3px 0;">👤 姓名：${name}</p>
                        <p style="margin:3px 0;">📞 電話：${phone}</p>
                        ${taxId ? `<p style="margin:3px 0;">🏢 統一編號：${taxId}</p>` : ''}
                        ${salesPerson ? `<p style="margin:3px 0;">👔 業務：${salesPerson}</p>` : ''}
                        ${line ? `<p style="margin:3px 0;">💬 LINE：${line}</p>` : ''}
                        ${vehicle ? `<p style="margin:3px 0;">🚗 車輛：${vehicle}</p>` : ''}
                        ${entryDate ? `<p style="margin:3px 0;">📅 進廠日期：${entryDate}</p>` : ''}
                        ${exitDate ? `<p style="margin:3px 0;">🚗 出廠日期：${exitDate}</p>` : ''}
                    </div>
                    
                    <table style="width:100%;border-collapse:collapse;margin-bottom:15px;">
                        <thead>
                            <tr style="background:#1a3d34;color:white;">
                                <th style="padding:10px;text-align:left;">項目</th>
                                <th style="padding:10px;text-align:center;">數量</th>
                                <th style="padding:10px;text-align:right;">金額</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                    </table>
                    
                    <div style="text-align:right;padding:15px;background:#1a3d34;color:white;border-radius:8px;">
                        <div style="margin:5px 0;">小計：$${subtotal.toLocaleString()}</div>
                        <div style="margin:5px 0;">稅金 (${taxRate}%)：$${tax.toLocaleString()}</div>
                        <div style="font-size:20px;font-weight:bold;margin-top:10px;">總計：$${total.toLocaleString()}</div>
                        ${deposit > 0 ? `
                        <div style="margin:5px 0;font-size:14px;opacity:0.9;">💵 訂金：$${deposit.toLocaleString()}</div>
                        <div style="margin:5px 0;font-size:14px;opacity:0.9;">💳 尚欠：$${(total-deposit).toLocaleString()}</div>
                        ` : ''}
                    </div>
                    
                    ${notes ? `
                    <div style="margin-top:15px;padding:15px;background:#fff9e6;border-radius:8px;">
                        <h4 style="color:#1a3d34;margin:0 0 10px 0;">📝 備註</h4>
                        <p style="margin:0;">${notes}</p>
                    </div>
                    ` : ''}
                    
                    <div style="text-align:center;margin-top:30px;color:#999;font-size:12px;">
                        <p>感謝您的信任！我們會盡快與您聯繫。</p>
                    </div>
                </div>
            `;
            
            const opt = {
                margin: 10,
                filename: '報價單-' + quoteId + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(pdfContent).save();
        }
        
        // PWA 功能 - 註冊 service worker
        // if('serviceWorker' in navigator) {
        //     navigator.serviceWorker.register('sw.js').catch(() => {});
        // }
    </script>
</body>
</html>
